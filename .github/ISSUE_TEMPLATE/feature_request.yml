name: Feature request
description: Propose a capability or improvement in any Community package family.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use [CONTRIBUTING](https://github.com/anarchitects/anarchitecture-community/blob/main/CONTRIBUTING.md) and the [ownership inventory](https://github.com/anarchitects/anarchitecture-community/blob/main/OWNERSHIP.md) for guidance.
        Short answers and existing links are enough. Ownership can be confirmed during triage; submitting does not commit you to implementation.
        These answers provide intake context, not automatic project-field updates or release authorization.

  - type: dropdown
    id: affected-project
    attributes:
      label: Affected package family or repository area
      description: Name exact packages, versions and scope in the details below. Select all relevant areas.
      multiple: true
      options:
        - Better Auth TypeORM (Auth)
        - Nest Angular SSR (SSR)
        - Governance (Core, adapters, extensions, CLI, Python/dbt)
        - Editor.js (authoring, tools, uploads, HTML rendering)
        - Repository tooling / CI / release operations
        - Documentation / planning
        - Fixture apps
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: Describe the consumer need and expected benefit. Link existing examples or evidence if available.
    validations:
      required: true

  - type: textarea
    id: proposed-capability
    attributes:
      label: Proposed scope
      description: Name affected packages/contracts and what should change. Mention material exclusions, alternatives or compatibility constraints; an API design is optional.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: How could the owner verify the promised result? Distinguish implementation, publication and consumer adoption when separately tracked. Open questions are welcome at intake.
    validations:
      required: true

  - type: textarea
    id: ownership-dependencies
    attributes:
      label: Ownership and dependencies (if known)
      description: Maintainers confirm the accountable Owner and Domain/Capability before Ready. Link parent/related issues and any Blocked by dependency, its owner and next action. Leave unagreed release/iteration commitments unset.
      placeholder: |
        Owner / Domain or Capability: unknown; needs triage
        Parent or related work:
        Blocked by / responsible owner / next action:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence or consumer follow-through
      description: Link prior art, proposed validation, affected consumers or local exceptions. State any release impact; the App PO and capability owner jointly decide exceptions and cutover.
    validations:
      required: false
