name: Bug report
description: Report a defect in any package, fixture, workflow or documentation path.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use [CONTRIBUTING](https://github.com/anarchitects/anarchitecture-community/blob/main/CONTRIBUTING.md) and the [ownership inventory](https://github.com/anarchitects/anarchitecture-community/blob/main/OWNERSHIP.md) for guidance.
        Short answers and existing links are enough. Ownership can be confirmed during triage; submitting does not commit you to implementation.
        These answers provide intake context, not automatic project-field updates or release authorization.

  - type: dropdown
    id: affected-project
    attributes:
      label: Affected package family or repository area
      description: Name exact packages, versions and scope in the details below. Select all relevant areas.
      multiple: true
      options:
        - Better Auth TypeORM (Auth)
        - Nest Angular SSR (SSR)
        - Governance (Core, adapters, extensions, CLI, Python/dbt)
        - Editor.js (authoring, tools, uploads, HTML rendering)
        - Repository tooling / CI / release operations
        - Documentation / planning
        - Fixture apps
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior and affected scope
      description: What fails, which exact packages or repository paths are involved, and what is the impact?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected outcome and acceptance
      description: What should happen, and what observation would demonstrate this bug is resolved? State if publication or consumer adoption is part of the requested outcome.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and evidence
      description: Give the shortest reproduction or link an existing example/failing run. If not reproducible yet, say what is known. Redact credentials and private data.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include package/runtime/framework versions and OS. For SSR, include HTTP adapter and CJS/ESM mode; for Editor.js, browser/rendering mode; for dbt, Python/dbt/artifact versions. For docs/planning, a link or revision is enough.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or workaround
      description: Add useful evidence or a temporary workaround. Keep consumer exceptions and their upstream/cutover work linked; publication alone does not prove adoption.
    validations:
      required: false

  - type: textarea
    id: ownership-dependencies
    attributes:
      label: Ownership and dependencies (if known)
      description: Maintainers confirm the accountable Owner and Domain/Capability before Ready. Link parent/related issues and any Blocked by dependency, its owner and next action. Leave unagreed release/iteration commitments unset.
      placeholder: |
        Owner / Domain or Capability: unknown; needs triage
        Parent or related work:
        Blocked by / responsible owner / next action:
    validations:
      required: false
