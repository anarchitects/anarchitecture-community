name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example governance-core@1.2.3
        required: true
        type: string
      record_artifact_id:
        description: Retained preparation artifact ID (after activation)
        type: string
      record_digest:
        description: SHA-256 of release-record.json (after activation)
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Remove this legacy branch in #722 before reopening release automation.
    if: vars.COMMUNITY_RELEASE_CONTROLS == ''
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.tag || github.event.release.tag_name }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          ref_name="$RELEASE_REF"

          if [[ ! "$ref_name" =~ ^[a-z][a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unable to resolve a release tag from the event payload"
            exit 1
          fi

          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Derive project from tag
        id: tag
        shell: bash
        run: |
          ref_name="$RELEASE_REF"
          project="${ref_name%@*}"
          version="${ref_name##*@}"

          if [ -z "$project" ] || [ -z "$version" ] || [ "$project" = "$ref_name" ]; then
            echo "Invalid release tag: $ref_name"
            echo "Expected format: <nx-project-name>@<version>"
            exit 1
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Publishing project: $project"
          echo "Version: $version"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.ref.outputs.ref_name }}
          fetch-depth: 0
          filter: tree:0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Nx project exists
        shell: bash
        run: |
          yarn nx show project "$RELEASE_PROJECT" > /dev/null

        env:
          RELEASE_PROJECT: ${{ steps.tag.outputs.project }}

      - name: Validate and pack governance-dbt-package
        if: steps.tag.outputs.project == 'governance-dbt-package'
        run: |
          yarn nx run governance-dbt-package:validate
          yarn nx run governance-dbt-package:pack

      - name: Build project
        if: steps.tag.outputs.project != 'governance-dbt-package'
        run: yarn nx build "$RELEASE_PROJECT"

        env:
          RELEASE_PROJECT: ${{ steps.tag.outputs.project }}

      - name: Typecheck project
        run: yarn nx typecheck "$RELEASE_PROJECT"
        if: steps.tag.outputs.project != 'governance-host-dbt' && steps.tag.outputs.project != 'governance-dbt-package'

        env:
          RELEASE_PROJECT: ${{ steps.tag.outputs.project }}

      - name: Test project
        run: yarn nx test "$RELEASE_PROJECT"
        if: steps.tag.outputs.project != 'governance-dbt-package'

        env:
          RELEASE_PROJECT: ${{ steps.tag.outputs.project }}

      - name: Run Better Auth TypeORM Adapter Postgres tests
        if: steps.tag.outputs.project == 'better-auth-typeorm-adapter'
        run: yarn nx run better-auth-typeorm-adapter:test-postgres

      - name: Run Better Auth TypeORM Adapter Better Auth tests
        if: steps.tag.outputs.project == 'better-auth-typeorm-adapter'
        run: yarn nx run better-auth-typeorm-adapter:test-better-auth

      - name: Validate packed Nest Angular SSR consumers
        if: steps.tag.outputs.project == 'nest-angular-ssr'
        run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-release-gate

      - name: Publish project
        run: yarn nx release publish --projects "$RELEASE_PROJECT" --yes
        env:
          RELEASE_PROJECT: ${{ steps.tag.outputs.project }}
          NPM_CONFIG_PROVENANCE: true

  forward:
    if: vars.COMMUNITY_RELEASE_CONTROLS == 'active'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # No checkout, registry credential, OIDC or release App key in this job.
      - uses: actions/github-script@v8
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ARTIFACT: ${{ inputs.record_artifact_id }}
          INPUT_DIGEST: ${{ inputs.record_digest }}
        with:
          script: |
            const release = context.payload.release;
            let tag = process.env.INPUT_TAG;
            let artifact = process.env.INPUT_ARTIFACT;
            let digest = process.env.INPUT_DIGEST;
            if (release) {
              tag = release.tag_name;
              const match = /\nCommunity release record: ([1-9]\d*)\nSHA256: ([a-f0-9]{64})\nPreparation: ([1-9]\d*)\nCandidate: ([a-f0-9]{40})\n$/.exec(release.body || '');
              if (!match) throw new Error('Missing release record; use the reviewed manual controller');
              artifact = match[1]; digest = match[2];
            } else if (context.ref !== 'refs/heads/main') {
              throw new Error('Dispatch the main controller');
            }
            if (!/^[a-z][a-z0-9-]+@\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || !/^[1-9]\d*$/.test(artifact) || !/^[a-f0-9]{64}$/.test(digest)) throw new Error('Invalid publication request');
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'publish-controller.yml', ref: 'main', inputs: { tag, record_artifact_id: artifact, record_digest: digest, operation: 'publish' }});
