name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example governance-core@1.2.3
        required: true
        type: string

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          ref_name='${{ inputs.tag || github.event.release.tag_name }}'

          if [ -z "$ref_name" ]; then
            echo "Unable to resolve a release tag from the event payload"
            exit 1
          fi

          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Derive project from tag
        id: tag
        shell: bash
        run: |
          ref_name='${{ steps.ref.outputs.ref_name }}'
          project="${ref_name%@*}"
          version="${ref_name##*@}"

          if [ -z "$project" ] || [ -z "$version" ] || [ "$project" = "$ref_name" ]; then
            echo "Invalid release tag: $ref_name"
            echo "Expected format: <nx-project-name>@<version>"
            exit 1
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Publishing project: $project"
          echo "Version: $version"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.ref.outputs.ref_name }}
          fetch-depth: 0
          filter: tree:0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Nx project exists
        shell: bash
        run: |
          yarn nx show project "${{ steps.tag.outputs.project }}" > /dev/null

      - name: Build project
        run: yarn nx build "${{ steps.tag.outputs.project }}"

      - name: Typecheck project
        run: yarn nx typecheck "${{ steps.tag.outputs.project }}"
        if: steps.tag.outputs.project != 'governance-host-dbt'

      - name: Test project
        run: yarn nx test "${{ steps.tag.outputs.project }}"

      - name: Run Better Auth TypeORM Adapter Postgres tests
        if: steps.tag.outputs.project == 'better-auth-typeorm-adapter'
        run: yarn nx run better-auth-typeorm-adapter:test-postgres

      - name: Run Better Auth TypeORM Adapter Better Auth tests
        if: steps.tag.outputs.project == 'better-auth-typeorm-adapter'
        run: yarn nx run better-auth-typeorm-adapter:test-better-auth

      - name: Publish project
        run: yarn nx release publish --projects "${{ steps.tag.outputs.project }}" --yes
        env:
          NPM_CONFIG_PROVENANCE: true
