name: CI

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  editorjs-core-runtime-baseline:
    name: editorjs-core (Node 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: 'yarn'
      - run: yarn install --immutable
      # Avoid reusing results produced on Node 24 by the main job.
      - run: yarn nx run-many -p editorjs-core -t build typecheck test lint --skipNxCache

  better-auth-typeorm-adapter-compatibility:
    name: better-auth-typeorm-adapter (Node ${{ matrix.node }}, TypeORM ${{ matrix.typeorm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            typeorm: 1.0.0
          - node: 24
            typeorm: ^1.0.0
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Select TypeORM compatibility version
        run: yarn up "typeorm@${{ matrix.typeorm }}"
      - run: yarn nx run better-auth-typeorm-adapter:build
      - run: yarn nx run better-auth-typeorm-adapter:typecheck
      - run: yarn nx run better-auth-typeorm-adapter:test
      - run: yarn nx run better-auth-typeorm-adapter:test-postgres
      - run: yarn nx run better-auth-typeorm-adapter:test-better-auth

  nest-angular-ssr-compatibility:
    name: nest-angular-ssr (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - angular21-nx22
          - angular21-nx23
          - angular22-nx23
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-matrix --cell=${{ matrix.cell }}

  editorjs-angular-browser:
    name: editorjs-angular (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers --with-deps
      - run: yarn nx run editorjs-angular-e2e:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-playwright
          path: apps/editorjs/angular-e2e/test-output
          retention-days: 7
          if-no-files-found: ignore

  editorjs-angular-packed-consumers:
    name: editorjs-angular packed (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - angular22-minimum
          - angular22-reference
          - angular22-current
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers --with-deps
      - run: yarn nx run editorjs-angular-e2e:e2e-packed --cell=${{ matrix.cell }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-packed-${{ matrix.cell }}
          path: apps/editorjs/angular-e2e/test-output/compatibility/${{ matrix.cell }}
          retention-days: 7
          if-no-files-found: ignore

  editorjs-angular-ssr:
    name: editorjs-angular SSR (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers --with-deps
      - run: yarn nx run editorjs-angular-e2e:test-ssr
      - run: yarn nx run editorjs-angular-e2e:e2e-hydration
      - run: yarn nx run editorjs-angular-e2e:e2e-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-ssr-workspace
          path: |
            apps/editorjs/angular-e2e/test-output/ssr
            apps/editorjs/angular-e2e/test-output/hydration
            apps/editorjs/angular-e2e/test-output/isolation
          retention-days: 7
          if-no-files-found: ignore

  editorjs-angular-packed-ssr:
    name: editorjs-angular packed SSR (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - angular22-minimum
          - angular22-reference
          - angular22-current
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers --with-deps
      - run: yarn nx run editorjs-angular-e2e:e2e-packed-ssr --cell=${{ matrix.cell }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-packed-ssr-${{ matrix.cell }}
          path: apps/editorjs/angular-e2e/test-output/ssr-compatibility/${{ matrix.cell }}
          retention-days: 7
          if-no-files-found: ignore

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - run: corepack enable

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: yarn dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: yarn install --immutable
      - run: python -m pip install "dbt-core>=1.11,<1.12" "dbt-duckdb>=1.10,<1.11"

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: yarn nx record -- echo Hello World
      - run: yarn nx run-many -t lint test build typecheck
      - run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-split
      - run: yarn nx run better-auth-typeorm-adapter:test-postgres
      - run: yarn nx run better-auth-typeorm-adapter:test-better-auth
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: yarn nx fix-ci
        if: always()
