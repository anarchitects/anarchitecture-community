name: CI

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  editorjs-core-runtime-baseline:
    name: Editor.js neutral packages (Node 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: 'yarn'
      - run: yarn install --immutable
      # Runtime-specific inputs keep Node 22 and Node 24 cache results separate.
      - run: yarn nx run-many -p editorjs-core editorjs-tool-paragraph editorjs-tool-header editorjs-tool-list editorjs-tool-quote editorjs-tool-image editorjs-upload-fetch -t build typecheck test lint

  better-auth-typeorm-adapter-compatibility:
    name: better-auth-typeorm-adapter (Node ${{ matrix.node }}, TypeORM ${{ matrix.typeorm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            typeorm: 1.0.0
          - node: 24
            typeorm: ^1.0.0
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Select TypeORM compatibility version
        run: yarn up "typeorm@${{ matrix.typeorm }}"
      - run: yarn nx run better-auth-typeorm-adapter:build
      - run: yarn nx run better-auth-typeorm-adapter:typecheck
      - run: yarn nx run better-auth-typeorm-adapter:test
      - run: yarn nx run better-auth-typeorm-adapter:test-postgres
      - run: yarn nx run better-auth-typeorm-adapter:test-better-auth

  nest-angular-ssr-consumers:
    name: nest-angular-ssr consumers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      # macOS exercises guard bypass on a case-insensitive filesystem.
      - run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-consumers

  nest-angular-ssr-compatibility:
    name: nest-angular-ssr (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - angular21-nx22
          - angular21-nx23
          - angular22-nx23
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-matrix --cell=${{ matrix.cell }}

  editorjs-angular-browser:
    name: editorjs-angular (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers:ci
      - run: yarn nx run editorjs-angular-e2e:e2e
      - run: yarn nx run editorjs-upload-fetch:test-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-playwright
          path: |
            apps/editorjs/angular-e2e/test-output
            packages/editorjs/upload-fetch/test-output/browser
          retention-days: 7
          if-no-files-found: ignore

  editorjs-angular-ssr:
    name: editorjs-angular SSR (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn nx run editorjs-angular-e2e:install-browsers:ci
      - run: yarn nx run editorjs-angular-e2e:test-ssr
      - run: yarn nx run editorjs-angular-e2e:e2e-hydration
      - run: yarn nx run editorjs-angular-e2e:e2e-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-ssr-workspace
          path: |
            apps/editorjs/angular-e2e/test-output/ssr
            apps/editorjs/angular-e2e/test-output/hydration
            apps/editorjs/angular-e2e/test-output/isolation
          retention-days: 7
          if-no-files-found: ignore

  editorjs-angular-packed:
    name: editorjs-angular packed (Nx DTE)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EDITORJS_PACKED_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      NX_CI_EXECUTION_ID: packed-${{ github.run_id }}-${{ github.run_attempt }}
      NG_BUILD_MAX_WORKERS: '2'
      NX_CACHE_FAILURES: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: 'yarn'
      - run: yarn install --immutable
      # Fresh registry resolution stays outside DTE. The snapshots include the
      # Forms-absent boundary proof and installed, version-matched dependencies.
      - name: Verify packed harness contracts
        run: yarn nx run editorjs-angular-e2e:test-packed-harness
      - name: Validate packed worker template
        run: yarn nx-cloud validate --workflow-file=./.nx/workflows/editorjs-packed.yaml
      - name: Prepare fresh compatibility snapshots
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
        run: >-
          yarn nx run-many -p editorjs-angular-e2e
          -t packed-csr-angular22-minimum-prepare,packed-csr-angular22-reference-prepare,packed-csr-angular22-current-prepare,packed-ssr-angular22-minimum-prepare,packed-ssr-angular22-reference-prepare,packed-ssr-angular22-current-prepare
          --parallel=3 --runId="$EDITORJS_PACKED_RUN_ID"
      - uses: actions/upload-artifact@v4
        id: inputs
        with:
          name: editorjs-packed-inputs
          path: dist/editorjs-packed-inputs
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Start packed validation workers
        id: workers
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORJS_PACKED_ARTIFACT_ID: ${{ steps.inputs.outputs.artifact-id }}
          PACKED_DISTRIBUTION: ${{ vars.EDITORJS_PACKED_DISTRIBUTION || '3 editorjs-packed' }}
        run: >-
          yarn nx-cloud start-ci-run --distribute-on="$PACKED_DISTRIBUTION"
          --require-explicit-completion --stop-workers-on-failure=false
          --with-env-vars=EDITORJS_PACKED_RUN_ID,EDITORJS_PACKED_ARTIFACT_ID,GITHUB_REPOSITORY,GH_TOKEN,NG_BUILD_MAX_WORKERS,NX_CACHE_FAILURES
      # Every atom is requested so Nx restores its outputs to the coordinator.
      # Failed checks fail Nx; independent atoms finish to retain their evidence.
      - name: Distribute packed build and file atoms
        run: >-
          yarn nx run-many -p editorjs-angular-e2e
          -t "$(node apps/editorjs/angular-e2e/tools/packed-targets.mjs)"
          --parallel=2 --runId="$EDITORJS_PACKED_RUN_ID"
      - name: Enforce all packed validation outcomes
        if: ${{ !cancelled() && steps.workers.outcome == 'success' }}
        run: node apps/editorjs/angular-e2e/tools/packed-results.mjs "$EDITORJS_PACKED_RUN_ID"
      - name: Complete packed DTE
        if: ${{ always() && steps.workers.outcome == 'success' }}
        run: yarn nx-cloud complete-ci-run
      - name: Verify remote packed output restoration
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
        run: node apps/editorjs/angular-e2e/tools/packed-cache-audit.mjs "$EDITORJS_PACKED_RUN_ID" remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorjs-angular-packed-evidence
          path: |
            dist/editorjs-packed-results
            dist/editorjs-packed-inputs/**/evidence
          retention-days: 7
          if-no-files-found: ignore

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - run: corepack enable

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: yarn dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - run: yarn install --immutable
      - run: python -m pip install "dbt-core>=1.11,<1.12" "dbt-duckdb>=1.10,<1.11"

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: yarn nx record -- echo Hello World
      - run: yarn nx run-many -t lint test build typecheck
      - run: yarn nx run @anarchitecture-community/source:validate-nest-angular-ssr-split
      - run: yarn nx run better-auth-typeorm-adapter:test-postgres
      - run: yarn nx run better-auth-typeorm-adapter:test-better-auth
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: yarn nx fix-ci
        if: always()
