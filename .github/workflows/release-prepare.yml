name: Prepare release record
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful source-branch CI run for the exact versioned commit
        required: true
        type: string
      line:
        description: Approved source line (standard excludes SSR)
        type: choice
        default: standard
        options: [standard, nest11, nest12]
      source_commit:
        description: Exact protected maintenance head SHA (Nest 11 only)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: community-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      RELEASE_CI_RUN_ID: ${{ inputs.ci_run }}
      RELEASE_LINE: ${{ inputs.line }}
      RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the protected source before executing candidate code
        id: source
        run: node tools/release/source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.3'
          cache: yarn
          cache-dependency-path: controller/yarn.lock
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: yarn install --immutable
      - run: python -m pip install 'dbt-core>=1.11,<1.12' 'dbt-duckdb>=1.10,<1.11'
      - uses: actions/checkout@v6
        if: inputs.line == 'nest11'
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: maintenance-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install maintenance build dependencies without release credentials
        if: inputs.line == 'nest11'
        working-directory: maintenance-source
        run: yarn install --immutable
      - name: Validate, build and retain final bytes
        id: freeze
        run: |
          case "$RELEASE_LINE" in
            nest11)
              cd ../maintenance-source
              node ../controller/tools/release/prepare.mjs freeze --line=nest11 --out=../release-payload
              ;;
            nest12) yarn nx run @anarchitecture-community/source:freeze-release-record --line=nest12 --out=../release-payload ;;
            standard) yarn nx run @anarchitecture-community/source:freeze-release-record --out=../release-payload ;;
            *) exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        id: record
        with:
          name: community-release-record
          path: release-payload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Record immutable handoff
        env:
          ARTIFACT_ID: ${{ steps.record.outputs.artifact-id }}
          RECORD_DIGEST: ${{ steps.freeze.outputs.digest }}
        run: |
          printf 'Artifact ID: %s\n\nRecord SHA-256: %s\n\nController: %s\n\nSource line: %s\n' "$ARTIFACT_ID" "$RECORD_DIGEST" "$GITHUB_SHA" "$RELEASE_LINE" >> "$GITHUB_STEP_SUMMARY"
