name: Verify release credentials
run-name: 'Verify release credentials — ${{ inputs.expected_fingerprint }}'

on:
  workflow_dispatch:
    inputs:
      expected_fingerprint:
        description: Public SHA256 fingerprint of the replacement App key
        required: true
        type: string
        default: 'SHA256:uAFgHxw1IaoGogEEwuvQb1+Su7p0nqjm0Gsn2Ofavco='

permissions: {}

concurrency:
  group: verify-release-credentials
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: community-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public key fingerprint
        env:
          APP_KEY: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        run: |
          node <<'NODE'
          const { createHash, createPublicKey } = require('node:crypto');
          try {
            const key = createPublicKey(process.env.APP_KEY);
            if (key.asymmetricKeyType !== 'rsa') throw new Error();
            const fingerprint = 'SHA256:' + createHash('sha256')
              .update(key.export({ type: 'spki', format: 'der' })).digest('base64');
            if (fingerprint !== process.env.EXPECTED_FINGERPRINT) throw new Error();
            console.log('Verified public fingerprint: ' + fingerprint);
          } catch {
            console.error('App key missing, invalid, or different from the approved fingerprint.');
            process.exitCode = 1;
          }
          NODE

      - name: Create repository-scoped token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ANARCHITECTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          skip-token-revoke: false

      - name: Verify scope and read main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api installation/repositories > scope.json
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.total_count == 1 and (.repositories | length) == 1 and .repositories[0].full_name == $repo' \
            scope.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '"Verified main: " + .object.sha'
          printf 'Verified repository scope: %s\n' "$GITHUB_REPOSITORY"

