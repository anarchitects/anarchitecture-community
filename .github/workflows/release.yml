name: Release (Manual)
run-name: 'Release record ${{ inputs.record_artifact_id }}'

on:
  workflow_dispatch:
    inputs:
      record_artifact_id:
        description: Immutable artifact ID from Prepare release record
        required: true
        type: string
      record_digest:
        description: SHA-256 of release-record.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: community-publication
  cancel-in-progress: false
  queue: max

jobs:
  review:
    if: vars.COMMUNITY_RELEASE_CONTROLS == 'active' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      COMMUNITY_RELEASE_CONTROLS: ${{ vars.COMMUNITY_RELEASE_CONTROLS }}
      RELEASE_ARTIFACT_ID: ${{ inputs.record_artifact_id }}
      RELEASE_DIGEST: ${{ inputs.record_digest }}
      RELEASE_ACTION: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve retained preparation run
        id: source
        run: node tools/release/controller.mjs locate
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.record_artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-payload
          merge-multiple: true
      - run: node tools/release/controller.mjs review
        env:
          GH_TOKEN: ${{ github.token }}
  approved:
    needs: review
    environment: community-release
    runs-on: ubuntu-latest
    env:
      COMMUNITY_RELEASE_CONTROLS: ${{ vars.COMMUNITY_RELEASE_CONTROLS }}
      RELEASE_ARTIFACT_ID: ${{ inputs.record_artifact_id }}
      RELEASE_DIGEST: ${{ inputs.record_digest }}
      RELEASE_ACTION: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve retained preparation run
        id: source
        run: node tools/release/controller.mjs locate
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.record_artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-payload
          merge-multiple: true
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.ANARCHITECTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Revalidate and create exact approved tags and releases
        run: node tools/release/controller.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipt.json
          retention-days: 90
